# Redox FHIR Ingestion Pipeline
#
# This workflow ingests FHIR bundles from Redox via a mounted location
# and processes them through Bronze, Silver, and Gold (OMOP CDM) layers.
#
# Trigger: File arrival in the mount path
# Tables: Bronze (raw), Silver (per resource type), Gold (OMOP CDM v5.4)

resources:
  jobs:
    redox_fhir_pipeline:
      name: "Redox FHIR Ingestion Pipeline"
      description: "Ingest and process Redox FHIR bundles into realtime analytics tables"

      # File arrival trigger - monitors mount for new FHIR bundles
      trigger:
        pause_status: PAUSED  # Set to UNPAUSED in production
        file_arrival:
          url: ${var.mount_path}
          min_time_between_triggers_seconds: 600
          wait_after_last_change_seconds: 60

      # Allow multiple concurrent runs for high-volume ingestion
      max_concurrent_runs: 5

      # Job parameters
      parameters:
        - name: catalog_use
          default: ${var.catalog}
        - name: schema_use
          default: ${var.schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: mount_path
          default: ${var.mount_path}
        - name: full_refresh
          default: "false"

      # Queue for fair scheduling
      queue:
        enabled: true

      # Email notifications on failure
      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        # Task 1: Conditional full refresh (drop tables)
        - task_key: check_full_refresh
          description: "Check if full refresh is requested"
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/06 - Drop Tables.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              schema_use: "{{job.parameters.schema_use}}"
          run_if: "{{job.parameters.full_refresh}} == 'true'"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 2: Bronze ingestion (raw JSON + VARIANT)
        - task_key: bronze_ingestion
          description: "Ingest raw FHIR bundles into Bronze tables"
          depends_on:
            - task_key: check_full_refresh
              outcome: ALL_DONE
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/01 - Bronze Ingestion.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              schema_use: "{{job.parameters.schema_use}}"
              mount_path: "{{job.parameters.mount_path}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 3: Bundle metadata extraction
        - task_key: bundle_meta
          description: "Extract bundle-level metadata"
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/02 - Bundle Meta.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              schema_use: "{{job.parameters.schema_use}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 4: Explode resources and infer schemas
        - task_key: resources_exploded
          description: "Explode bundle entries and infer schemas"
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/03 - Resources Exploded.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              schema_use: "{{job.parameters.schema_use}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 5: Discover resource types (sets task values for for-each)
        - task_key: discover_resources
          description: "Discover available FHIR resource types"
          depends_on:
            - task_key: resources_exploded
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/05 - Discover Resource Types.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              schema_use: "{{job.parameters.schema_use}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 6: Create Silver tables (for-each resource type)
        - task_key: silver_tables
          description: "Create Silver tables for each resource type"
          depends_on:
            - task_key: discover_resources
            - task_key: bundle_meta
          for_each_task:
            inputs: "{{tasks.discover_resources.values.resource_types}}"
            concurrency: 20
            task:
              task_key: silver_resource
              notebook_task:
                notebook_path: src/redox-fhir-pipeline/04 - Silver Tables.ipynb
                base_parameters:
                  catalog_use: "{{job.parameters.catalog_use}}"
                  schema_use: "{{job.parameters.schema_use}}"
                  resource_type: "{{input}}"
                  full_refresh: "{{job.parameters.full_refresh}}"
              warehouse_id: ${var.sql_warehouse_id}

        # =====================================================================
        # GOLD LAYER: OMOP CDM v5.4 Tables
        # =====================================================================

        # Task 7: OMOP Person (from Patient)
        - task_key: omop_person
          description: "Transform Patient to OMOP Person"
          depends_on:
            - task_key: silver_tables
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/01 - Person.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 8: OMOP Care Site (from Organization)
        - task_key: omop_care_site
          description: "Transform Organization to OMOP Care Site"
          depends_on:
            - task_key: silver_tables
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/08 - Provider and Care Site.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 9: OMOP Visit Occurrence (from Encounter)
        - task_key: omop_visit
          description: "Transform Encounter to OMOP Visit Occurrence"
          depends_on:
            - task_key: omop_person
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/02 - Visit Occurrence.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 10: OMOP Condition Occurrence (from Condition)
        - task_key: omop_condition
          description: "Transform Condition to OMOP Condition Occurrence"
          depends_on:
            - task_key: omop_visit
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/03 - Condition Occurrence.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 11: OMOP Drug Exposure (from MedicationRequest)
        - task_key: omop_drug
          description: "Transform MedicationRequest to OMOP Drug Exposure"
          depends_on:
            - task_key: omop_visit
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/04 - Drug Exposure.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 12: OMOP Procedure Occurrence (from Procedure)
        - task_key: omop_procedure
          description: "Transform Procedure to OMOP Procedure Occurrence"
          depends_on:
            - task_key: omop_visit
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/05 - Procedure Occurrence.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 13: OMOP Measurement (from Observation - labs/vitals)
        - task_key: omop_measurement
          description: "Transform Observation (labs/vitals) to OMOP Measurement"
          depends_on:
            - task_key: omop_visit
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/06 - Measurement.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}

        # Task 14: OMOP Observation (from Observation - other)
        - task_key: omop_observation
          description: "Transform Observation (other) to OMOP Observation"
          depends_on:
            - task_key: omop_visit
          notebook_task:
            notebook_path: src/redox-fhir-pipeline/gold/07 - Observation.ipynb
            base_parameters:
              catalog_use: "{{job.parameters.catalog_use}}"
              silver_schema: "{{job.parameters.schema_use}}"
              gold_schema: "{{job.parameters.gold_schema}}"
          warehouse_id: ${var.sql_warehouse_id}
